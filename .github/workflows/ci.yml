name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run tests
        env:
          OPENAI_API_KEY: "test-dummy-key"
          SECRET_KEY: "test-dummy-secret"
          PINECONE_API_KEY: "test-dummy-key"
        run: uv run pytest tests/ -v

      - name: Build Docker image
        run: docker build -t docuquery .